<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d10" />
      <stop offset="50%" stop-color="#050505" />
      <stop offset="100%" stop-color="#0a0b0e" />
    </linearGradient>
    <linearGradient id="borderGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#333333" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#222222" />
    </linearGradient>
    <linearGradient id="projBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2b34" />
      <stop offset="100%" stop-color="#181920" />
    </linearGradient>
  </defs>

  <style>
    .header-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 800; font-size: 14px; fill: #ffffff; letter-spacing: 1.5px; }
    .proj-title { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #ffffff; font-weight: 700; }
    .proj-desc { font-family: 'Segoe UI', sans-serif; font-size: 12px; fill: #a0a0a0; }
    .proj-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #66ccff; }
  </style>

  <!-- Background Card -->
  <rect x="1.5" y="1.5" width="797" height="197" rx="12" fill="url(#cardGrad3)" stroke="url(#borderGrad3)" stroke-width="1.5" />

  <!-- Top Header Bar -->
  <path d="M 2 13 Q 2 2 13 2 L 787 2 Q 798 2 798 13 L 798 38 L 2 38 Z" fill="#121318" />
  <line x1="2" y1="38" x2="798" y2="38" stroke="#222222" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="24" cy="20" r="5" fill="#ff5f56" />
  <circle cx="42" cy="20" r="5" fill="#ffbd2e" />
  <circle cx="60" cy="20" r="5" fill="#27c93f" />

  <!-- Title -->
  <text x="80" y="24" class="header-title">💀 FEATURED PROJECTS</text>

  <!-- ================= Project 1 ================= -->
  <g transform="translate(20, 52)">
    <rect width="237" height="130" rx="8" fill="#111217" stroke="url(#projBorder)" stroke-width="1" />
    <rect x="12" y="12" width="40" height="18" rx="4" fill="#ffffff" fill-opacity="0.1" />
    <text x="32" y="25" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#ffffff">01</text>
    <text x="60" y="26" class="proj-title">PROJECT ALPHA</text>
    <text x="14" y="58" class="proj-desc">Full Stack Application</text>
    <text x="14" y="76" class="proj-desc">Web Platform &amp; API</text>
    <rect x="14" y="96" width="130" height="20" rx="4" fill="#1b2230" />
    <text x="22" y="110" class="proj-tag">REACT • NODE • SQL</text>
  </g>

  <!-- ================= Project 2 ================= -->
  <g transform="translate(281, 52)">
    <rect width="237" height="130" rx="8" fill="#111217" stroke="url(#projBorder)" stroke-width="1" />
    <rect x="12" y="12" width="40" height="18" rx="4" fill="#ffffff" fill-opacity="0.1" />
    <text x="32" y="25" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#ffffff">02</text>
    <text x="60" y="26" class="proj-title">PROJECT OMEGA</text>
    <text x="14" y="58" class="proj-desc">Automation &amp; Bots</text>
    <text x="14" y="76" class="proj-desc">Backend Services</text>
    <rect x="14" y="96" width="145" height="20" rx="4" fill="#1b2230" />
    <text x="22" y="110" class="proj-tag">PYTHON • FASTAPI • CI</text>
  </g>

  <!-- ================= Project 3 ================= -->
  <g transform="translate(542, 52)">
    <rect width="237" height="130" rx="8" fill="#111217" stroke="url(#projBorder)" stroke-width="1" />
    <rect x="12" y="12" width="40" height="18" rx="4" fill="#ffffff" fill-opacity="0.1" />
    <text x="32" y="25" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#ffffff">03</text>
    <text x="60" y="26" class="proj-title">PROJECT NEXUS</text>
    <text x="14" y="58" class="proj-desc">Next-Gen Technology</text>
    <text x="14" y="76" class="proj-desc">Interactive Systems</text>
    <rect x="14" y="96" width="150" height="20" rx="4" fill="#1b2230" />
    <text x="22" y="110" class="proj-tag">NEXT.JS • TAILWIND • TS</text>
  </g>
</svg>

