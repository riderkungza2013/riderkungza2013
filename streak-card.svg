<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 210" width="100%" height="100%">
  <defs>
    <linearGradient id="streakCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d10" />
      <stop offset="50%" stop-color="#050505" />
      <stop offset="100%" stop-color="#0a0b0e" />
    </linearGradient>
    <linearGradient id="streakBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#333333" />
      <stop offset="50%" stop-color="#ff3333" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#222222" />
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffbd2e" />
      <stop offset="40%" stop-color="#ff4433" />
      <stop offset="100%" stop-color="#cc0022" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffbd2e" />
      <stop offset="50%" stop-color="#ff3333" />
      <stop offset="100%" stop-color="#990011" />
    </linearGradient>
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .hdr-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 800; font-size: 13.5px; fill: #ffffff; letter-spacing: 1.5px; }
    .big-num { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 34px; font-weight: 800; fill: #ff3333; }
    .streak-lbl { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #dddddd; letter-spacing: 0.5px; }
    .streak-sub { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #777777; }
    .cur-title { font-family: 'Segoe UI', sans-serif; font-size: 13.5px; font-weight: 800; fill: #ffffff; letter-spacing: 0.5px; }
  </style>

  <!-- Background Card -->
  <rect x="1.5" y="1.5" width="797" height="207" rx="12" fill="url(#streakCardGrad)" stroke="url(#streakBorderGrad)" stroke-width="1.5" />

  <!-- Top Header Bar -->
  <path d="M 2 13 Q 2 2 13 2 L 787 2 Q 798 2 798 13 L 798 36 L 2 36 Z" fill="#121318" />
  <line x1="2" y1="36" x2="798" y2="36" stroke="#222222" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="24" cy="19" r="5" fill="#ff5f56" />
  <circle cx="42" cy="19" r="5" fill="#ffbd2e" />
  <circle cx="60" cy="19" r="5" fill="#27c93f" />

  <!-- Title -->
  <text x="80" y="23" class="hdr-title">🔥 GITHUB STREAK STATS</text>

  <!-- Status indicator -->
  <circle cx="770" cy="19" r="4" fill="#ff3333" filter="url(#redGlow)" />

  <!-- Vertical Dividers -->
  <line x1="270" y1="46" x2="270" y2="195" stroke="#1f2026" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="530" y1="46" x2="530" y2="195" stroke="#1f2026" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- ================= LEFT: TOTAL CONTRIBUTIONS ================= -->
  <g transform="translate(135, 0)" text-anchor="middle">
    <text x="0" y="100" class="big-num" filter="url(#redGlow)">85</text>
    <text x="0" y="132" class="streak-lbl">Total Contributions</text>
    <text x="0" y="158" class="streak-sub">Sep 21, 2019 – Present</text>
  </g>

  <!-- ================= CENTER: CURRENT STREAK ================= -->
  <g transform="translate(400, 0)" text-anchor="middle">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="92" r="32" stroke="url(#ringGrad)" stroke-width="3" fill="#121318" filter="url(#redGlow)" />
    
    <!-- Flame Icon positioned cleanly above ring apex -->
    <g transform="translate(0, 52)">
      <!-- Outer Flame -->
      <path d="M 0,-14 C 4.5,-9 9,-3 9,4 C 9,9 4.5,13.5 0,13.5 C -4.5,13.5 -9,9 -9,4 C -9,-3 -4.5,-9 0,-14 Z" fill="url(#fireGrad)" filter="url(#redGlow)" />
      <!-- Inner Flame Core -->
      <path d="M 0,-6 C 2,-3 4,0 4,4 C 4,6.5 2,9 0,9 C -2,9 -4,6.5 -4,4 C -4,0 -2,-3 0,-6 Z" fill="#ffffff" />
    </g>

    <!-- Current Streak Number (Cleanly centered inside circle) -->
    <text x="0" y="104" class="big-num" filter="url(#redGlow)">1</text>
    
    <!-- Label -->
    <text x="0" y="148" class="cur-title">Current Streak</text>
    <text x="0" y="168" class="streak-sub">● Active Daily</text>
  </g>

  <!-- ================= RIGHT: LONGEST STREAK ================= -->
  <g transform="translate(665, 0)" text-anchor="middle">
    <text x="0" y="100" class="big-num" filter="url(#redGlow)">4</text>
    <text x="0" y="132" class="streak-lbl">Longest Streak</text>
    <text x="0" y="158" class="streak-sub">All-Time Peak</text>
  </g>
</svg>
