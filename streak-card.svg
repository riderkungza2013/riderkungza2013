<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="streakCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d10" />
      <stop offset="50%" stop-color="#050505" />
      <stop offset="100%" stop-color="#0a0b0e" />
    </linearGradient>
    <linearGradient id="streakBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#333333" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#222222" />
    </linearGradient>
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .big-num { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 34px; font-weight: 800; fill: #ff3333; }
    .streak-lbl { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 13.5px; font-weight: 600; fill: #cccccc; letter-spacing: 0.5px; }
    .streak-sub { font-family: 'Segoe UI', sans-serif; font-size: 11.5px; fill: #777777; }
    .cur-title { font-family: 'Segoe UI', sans-serif; font-size: 14px; font-weight: 800; fill: #ffffff; letter-spacing: 0.5px; }
  </style>

  <!-- Background Card -->
  <rect x="1.5" y="1.5" width="797" height="197" rx="12" fill="url(#streakCardGrad)" stroke="url(#streakBorderGrad)" stroke-width="1.5" />

  <!-- Vertical Dividers -->
  <line x1="266" y1="30" x2="266" y2="170" stroke="#22232c" stroke-width="1.5" />
  <line x1="533" y1="30" x2="533" y2="170" stroke="#22232c" stroke-width="1.5" />

  <!-- ================= LEFT: TOTAL CONTRIBUTIONS ================= -->
  <g transform="translate(133, 0)" text-anchor="middle">
    <text x="0" y="80" class="big-num">85</text>
    <text x="0" y="115" class="streak-lbl">Total Contributions</text>
    <text x="0" y="140" class="streak-sub">Sep 21, 2019 - Present</text>
  </g>

  <!-- ================= CENTER: CURRENT STREAK ================= -->
  <g transform="translate(400, 0)" text-anchor="middle">
    <!-- Outer Ring -->
    <circle cx="0" cy="65" r="34" stroke="#ff3333" stroke-width="3" fill="#111218" filter="url(#redGlow)" />
    
    <!-- Flame Icon on Ring Top -->
    <path d="M -7 36 C -7 31 -2 24 0 20 C 2 24 7 31 7 36 C 8 41 4 45 0 45 C -4 45 -8 41 -7 36 Z" fill="#ff3333" filter="url(#redGlow)" />
    <path d="M -3 38 C -3 35 -1 31 0 28 C 1 31 3 35 3 38 C 3 41 1 43 0 43 C -1 43 -3 41 -3 38 Z" fill="#ffffff" />

    <!-- Current Streak Number -->
    <text x="0" y="77" class="big-num" fill="#ff3333">1</text>
    
    <!-- Label -->
    <text x="0" y="132" class="cur-title">Current Streak</text>
    <text x="0" y="152" class="streak-sub">Active</text>
  </g>

  <!-- ================= RIGHT: LONGEST STREAK ================= -->
  <g transform="translate(666, 0)" text-anchor="middle">
    <text x="0" y="80" class="big-num">4</text>
    <text x="0" y="115" class="streak-lbl">Longest Streak</text>
    <text x="0" y="140" class="streak-sub">Sep 25 - Sep 28</text>
  </g>
</svg>
