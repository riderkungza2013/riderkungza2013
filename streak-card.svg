<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 210" width="100%" height="100%">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="cardBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1017" />
      <stop offset="50%" stop-color="#06070a" />
      <stop offset="100%" stop-color="#090a10" />
    </linearGradient>

    <!-- Outer Border Gradient with Red Hue Accent -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2d3d" />
      <stop offset="50%" stop-color="#ff3344" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1e202b" />
    </linearGradient>

    <!-- Big Number Red Gradient -->
    <linearGradient id="numGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6677" />
      <stop offset="50%" stop-color="#ff2233" />
      <stop offset="100%" stop-color="#cc0015" />
    </linearGradient>

    <!-- Flame Gradient -->
    <linearGradient id="fireGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffcc00" />
      <stop offset="40%" stop-color="#ff3322" />
      <stop offset="100%" stop-color="#990011" />
    </linearGradient>

    <!-- Arc Ring Gradient -->
    <linearGradient id="streakArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffbd2e" />
      <stop offset="60%" stop-color="#ff2a3a" />
      <stop offset="100%" stop-color="#aa0015" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="redGlowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .hdr-text { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 800; font-size: 13.5px; fill: #ffffff; letter-spacing: 1.5px; }
    .stat-label { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 700; font-size: 12.5px; fill: #d0d2db; letter-spacing: 0.5px; }
    .tag-text { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 10.5px; }
  </style>

  <!-- ================= BACKGROUND ================= -->
  <rect x="1.5" y="1.5" width="797" height="207" rx="12" fill="url(#cardBgGrad)" stroke="url(#cardBorder)" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <path d="M 2 13 Q 2 2 13 2 L 787 2 Q 798 2 798 13 L 798 38 L 2 38 Z" fill="#13151f" />
  <line x1="2" y1="38" x2="798" y2="38" stroke="#1f2230" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="24" cy="20" r="5" fill="#ff5f56" />
  <circle cx="42" cy="20" r="5" fill="#ffbd2e" />
  <circle cx="60" cy="20" r="5" fill="#27c93f" />

  <!-- Title -->
  <text x="82" y="24" class="hdr-text">🔥 GITHUB STREAK &amp; CONTRIBUTION METRICS</text>

  <!-- Live Status Pill -->
  <rect x="695" y="10" width="85" height="20" rx="10" fill="#ff2a3a" fill-opacity="0.12" stroke="#ff2a3a" stroke-width="1" />
  <circle cx="710" cy="20" r="3.5" fill="#ff3344" filter="url(#redGlowSoft)" />
  <text x="720" y="24" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#ff4455">ACTIVE</text>

  <!-- Vertical Column Dividers -->
  <line x1="270" y1="50" x2="270" y2="190" stroke="#1c1e29" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="530" y1="50" x2="530" y2="190" stroke="#1c1e29" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- ================= LEFT COLUMN: TOTAL CONTRIBUTIONS ================= -->
  <g transform="translate(135, 0)">
    <!-- Big Number -->
    <text x="0" y="104" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="900" font-size="38" fill="url(#numGrad)" filter="url(#redGlowSoft)">85</text>
    
    <!-- Label -->
    <text x="0" y="134" text-anchor="middle" class="stat-label">TOTAL CONTRIBUTIONS</text>
    
    <!-- Subtitle Pill -->
    <rect x="-80" y="148" width="160" height="24" rx="6" fill="#141620" stroke="#222533" stroke-width="1" />
    <text x="0" y="164" text-anchor="middle" class="tag-text" font-weight="600" fill="#8d90a5">Sep 2019 – Present</text>
  </g>

  <!-- ================= CENTER COLUMN: CURRENT STREAK (HERO) ================= -->
  <g transform="translate(400, 0)">
    <!-- Outer Base Ring -->
    <circle cx="0" cy="95" r="36" fill="#12141c" stroke="#202230" stroke-width="2" />

    <!-- Active Glowing Arc -->
    <circle cx="0" cy="95" r="36" fill="none" stroke="url(#streakArcGrad)" stroke-width="3.5" stroke-dasharray="180 50" stroke-linecap="round" filter="url(#redGlowSoft)" />

    <!-- Flame Icon on Top Apex -->
    <g transform="translate(0, 48)">
      <path d="M 0,-13 C 3.5,-8 7,-3 7,3 C 7,7.5 3.5,11 0,11 C -3.5,11 -7,7.5 -7,3 C -7,-3 -3.5,-8 0,-13 Z" fill="url(#fireGrad2)" filter="url(#redGlowSoft)" />
      <path d="M 0,-5 C 1.8,-2 3.5,0.5 3.5,3.5 C 3.5,5.5 1.8,7.5 0,7.5 C -1.8,7.5 -3.5,5.5 -3.5,3.5 C -3.5,0.5 -1.8,-2 0,-5 Z" fill="#ffffff" />
    </g>

    <!-- Centered Streak Number -->
    <text x="0" y="106" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="900" font-size="30" fill="url(#numGrad)">1</text>

    <!-- Main Label -->
    <text x="0" y="152" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="800" font-size="13" fill="#ffffff" letter-spacing="0.5">CURRENT STREAK</text>

    <!-- Subtitle Pill -->
    <rect x="-55" y="164" width="110" height="22" rx="11" fill="#ff2a3a" fill-opacity="0.12" stroke="#ff2a3a" stroke-width="0.8" />
    <text x="0" y="179" text-anchor="middle" class="tag-text" font-weight="700" fill="#ff4455">ACTIVE TODAY</text>
  </g>

  <!-- ================= RIGHT COLUMN: LONGEST STREAK ================= -->
  <g transform="translate(665, 0)">
    <!-- Big Number -->
    <text x="0" y="104" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="900" font-size="38" fill="url(#numGrad)" filter="url(#redGlowSoft)">4</text>
    
    <!-- Label -->
    <text x="0" y="134" text-anchor="middle" class="stat-label">LONGEST STREAK</text>
    
    <!-- Subtitle Pill -->
    <rect x="-75" y="148" width="150" height="24" rx="6" fill="#141620" stroke="#222533" stroke-width="1" />
    <text x="0" y="164" text-anchor="middle" class="tag-text" font-weight="700" fill="#ffbd2e">⚡ All-Time Peak</text>
  </g>
</svg>
