<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d10" />
      <stop offset="50%" stop-color="#050505" />
      <stop offset="100%" stop-color="#0a0b0e" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#333333" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#222222" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#888888" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 800; font-size: 15px; fill: #ffffff; letter-spacing: 2px; }
    .label { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; font-size: 12px; fill: #777777; font-weight: 600; letter-spacing: 1px; }
    .value { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 13.5px; fill: #f0f0f0; font-weight: 600; }
    .badge-text { font-family: 'Segoe UI', sans-serif; font-size: 11px; font-weight: 700; fill: #000000; }
    .quote { font-family: 'Segoe UI', sans-serif; font-style: italic; font-size: 12px; fill: #888888; }
    .tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #ffffff; }
  </style>

  <!-- Background Card -->
  <rect x="1.5" y="1.5" width="797" height="227" rx="12" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Top Header Bar -->
  <path d="M 2 13 Q 2 2 13 2 L 787 2 Q 798 2 798 13 L 798 42 L 2 42 Z" fill="#121318" />
  <line x1="2" y1="42" x2="798" y2="42" stroke="#222222" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="24" cy="22" r="5" fill="#ff5f56" />
  <circle cx="42" cy="22" r="5" fill="#ffbd2e" />
  <circle cx="60" cy="22" r="5" fill="#27c93f" />

  <!-- Header Title -->
  <text x="82" y="27" class="title">⚡ SYSTEM PROFILE // BLACKOUT</text>

  <!-- Status Pill -->
  <rect x="690" y="12" width="90" height="20" rx="10" fill="#00ff66" fill-opacity="0.15" stroke="#00ff66" stroke-width="1" />
  <circle cx="705" cy="22" r="3.5" fill="#00ff66" filter="url(#glow)" />
  <text x="716" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00ff66">ONLINE</text>

  <!-- Left Column Data -->
  <!-- Row 1: USER -->
  <g transform="translate(30, 70)">
    <text x="0" y="0" class="label">USER</text>
    <rect x="110" y="-15" width="250" height="26" rx="6" fill="#181920" stroke="#282930" stroke-width="1" />
    <text x="122" y="3" class="value">Lightning Black XIII</text>
  </g>

  <!-- Row 2: ROLE -->
  <g transform="translate(30, 112)">
    <text x="0" y="0" class="label">ROLE</text>
    <rect x="110" y="-15" width="250" height="26" rx="6" fill="#181920" stroke="#282930" stroke-width="1" />
    <text x="122" y="3" class="value">Full Stack Developer</text>
  </g>

  <!-- Row 3: LOCATION -->
  <g transform="translate(30, 154)">
    <text x="0" y="0" class="label">LOCATION</text>
    <rect x="110" y="-15" width="250" height="26" rx="6" fill="#181920" stroke="#282930" stroke-width="1" />
    <text x="122" y="3" class="value">-</text>
  </g>

  <!-- Vertical Divider -->
  <line x1="400" y1="56" x2="400" y2="175" stroke="#1f2026" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Right Column Data -->
  <!-- Row 1: MODE -->
  <g transform="translate(425, 70)">
    <text x="0" y="0" class="label">MODE</text>
    <rect x="100" y="-15" width="245" height="26" rx="6" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3" />
    <text x="112" y="3" class="value" fill="#ffffff">BLACKOUT [PRO]</text>
  </g>

  <!-- Row 2: FOCUS -->
  <g transform="translate(425, 112)">
    <text x="0" y="0" class="label">FOCUS</text>
    <rect x="100" y="-15" width="245" height="26" rx="6" fill="#181920" stroke="#282930" stroke-width="1" />
    <text x="112" y="3" class="value">Build • Automate • Optimize</text>
  </g>

  <!-- Row 3: GITHUB -->
  <g transform="translate(425, 154)">
    <text x="0" y="0" class="label">HANDLE</text>
    <rect x="100" y="-15" width="245" height="26" rx="6" fill="#181920" stroke="#282930" stroke-width="1" />
    <text x="112" y="3" class="value" fill="#90caf9">@riderkungza2013</text>
  </g>

  <!-- Bottom Quote Bar -->
  <line x1="2" y1="188" x2="798" y2="188" stroke="#181920" stroke-width="1" />
  <text x="400" y="211" text-anchor="middle" class="quote">"Don't just write code. Build something worth remembering."</text>
</svg>

